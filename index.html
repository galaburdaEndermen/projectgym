<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f2" />
    <script>
      // Apply the saved appearance before the app paints.
      let appearance = 'system'
      try {
        appearance = localStorage.getItem('projectgym-appearance') || 'system'
      } catch {}
      const dark =
        appearance === 'dark' ||
        (appearance !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      document.querySelector('meta[name="theme-color"]').content = dark ? '#161d1b' : '#f5f6f2'
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta

    />
